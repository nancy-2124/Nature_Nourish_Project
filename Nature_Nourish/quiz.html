<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sustainability Quiz | Nature Nourish</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <nav>
    <h2 class="logo">Nature Nourish</h2>
    <ul>
        <li><a href="index.html"></a>Home</li>
        <li><a href="resource.html">Resources</a></li>
        <li><a href="food.html">Recipes</a></li>
        <li><a href="quiz.html">Quiz</a></li>
        <li><a href="about.html">About</a></li>
    </ul>
</nav>

    <!-- QUIZ SECTION -->
<section id="quiz" class="section">
    <h2>Sustainability Quiz</h2>

    <!-- LEVEL SELECTION -->
    <div id="levelSelectBox">
        <h3>Select Quiz Level</h3>

        <button id="level1Btn" class="levelBtn" onclick="startLevel(1)">Level 1</button>

<button id="level2Btn" class="levelBtn locked" onclick="startLevel(2)" disabled>
    Level 2 🔒
</button>

<button id="level3Btn" class="levelBtn locked" onclick="startLevel(3)" disabled>
    Level 3 🔒
</button>

    </div>
    <div id="quizBox" class="hidden">
        <h3 id="levelTitle"></h3>
        <p id="question"></p>
        <div id="options"></div>
        <button id="nextBtn" class="hidden">Next</button>
    </div>

    <!-- RESULT BOX -->
    <div id="resultBox" class="hidden">
        <h3>Your Score: <span id="score"></span></h3>
        <h3 id="badgeMsg"></h3>
        <button onclick="goBack()">Back to Levels</button>
    </div>
    <br>
     <a href="index.html" class="view-all-btn">⬅ Back to Home</a>
</section>
</body>
</html>
